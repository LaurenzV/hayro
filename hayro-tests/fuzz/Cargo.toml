[package]
name = "hayro-tests-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hayro-jbig2 = { path = "../../hayro-jbig2" }
hayro-jpeg2000 = { path = "../../hayro-jpeg2000", features = ["fearless_simd", "image"] }
image = { version = "0.25", default-features = false }

[[bin]]
name = "fuzz_jbig2"
path = "fuzz_targets/fuzz_jbig2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_jpeg2000"
path = "fuzz_targets/fuzz_jpeg2000.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
overflow-checks = true

[profile.release-fuzzing]
inherits = "release"
opt-level = 3
debug = false
codegen-units = 1
lto = true
